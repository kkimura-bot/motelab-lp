<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>相談を受け付けました | MOTE LAB</title>
  <meta name="description" content="MOTE LABへのご相談を受け付けました。2営業日以内にご連絡します。">
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&family=Noto+Sans+JP:wght@300;400;500;700;900&display=swap" rel="stylesheet">

  <style>
    /* CSS Variables — lpと共通 */
    :root {
      --navy:    #1F3A5F;
      --gold:    #C8A04D;
      --white:   #FFFFFF;
      --offwhite: #FAFAF8;
      --gray-bg: #F3F3F1;
      --text:    #1A1A1A;
      --muted:   #5A6370;
      --border:  rgba(31,58,95,0.10);
      --radius:  12px;
      --font:    'Inter', 'Noto Sans JP', sans-serif;
      --max-w:   1040px;
      --shadow:  0 2px 18px rgba(31,58,95,0.08);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; font-size: 16px; }

    body {
      font-family: var(--font);
      background: var(--offwhite);
      color: var(--text);
      line-height: 1.75;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    img { display: block; max-width: 100%; }
    a { color: inherit; text-decoration: none; }

    /* ナビ */
    .nav {
      background: rgba(31,58,95,0.96);
      padding: 0 24px;
    }

    .nav__inner {
      max-width: var(--max-w);
      margin: 0 auto;
      height: 56px;
      display: flex;
      align-items: center;
    }

    .nav__logo {
      font-weight: 900;
      font-size: 17px;
      letter-spacing: 0.14em;
      color: var(--white);
    }

    .nav__logo span {
      color: var(--gold);
      font-size: 11px;
      font-weight: 400;
      margin-left: 10px;
      letter-spacing: 0.04em;
    }

    /* メイン */
    .main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 80px 24px;
    }

    .thanks-card {
      max-width: 560px;
      width: 100%;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow);
      overflow: hidden;
      position: relative;
    }

    .thanks-card::before {
      content: '';
      display: block;
      height: 4px;
      background: linear-gradient(90deg, var(--navy), var(--gold));
    }

    .thanks-card__body {
      padding: 56px 48px 48px;
      text-align: center;
    }

    .thanks-card__icon {
      width: 56px;
      height: 56px;
      background: var(--navy);
      border-radius: 50%;
      margin: 0 auto 32px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .thanks-card__check {
      width: 26px;
      height: 26px;
      stroke: var(--white);
      stroke-width: 2.5;
      fill: none;
    }

    .thanks-card__pre {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 16px;
    }

    .thanks-card__heading {
      font-size: clamp(22px, 3.5vw, 30px);
      font-weight: 900;
      color: var(--navy);
      line-height: 1.4;
      margin-bottom: 20px;
    }

    .thanks-card__body-text {
      font-size: 15px;
      color: var(--muted);
      line-height: 1.9;
      margin-bottom: 40px;
    }

    .thanks-card__actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn-navy {
      display: inline-block;
      background: var(--navy);
      color: var(--white);
      font-size: 14px;
      font-weight: 700;
      padding: 16px 36px;
      border-radius: 100px;
      letter-spacing: 0.03em;
      transition: opacity 0.2s, transform 0.2s;
    }

    .btn-navy:hover { opacity: 0.85; transform: translateY(-2px); }

    .btn-gold {
      display: inline-block;
      background: var(--gold);
      color: var(--navy);
      font-size: 14px;
      font-weight: 700;
      padding: 14px 36px;
      border-radius: 100px;
      letter-spacing: 0.03em;
      transition: opacity 0.2s, transform 0.2s;
    }

    .btn-gold:hover { opacity: 0.88; transform: translateY(-2px); }

    .btn-line {
      display: inline-block;
      background: var(--offwhite);
      border: 1.5px solid var(--border);
      color: var(--navy);
      font-size: 13px;
      font-weight: 700;
      padding: 12px 28px;
      border-radius: 100px;
      letter-spacing: 0.02em;
      transition: background 0.2s;
    }

    .btn-line:hover { background: var(--gray-bg); }

    .thanks-card__note {
      margin-top: 28px;
      padding-top: 28px;
      border-top: 1px solid var(--border);
      font-size: 12px;
      color: var(--muted);
      text-align: center;
      line-height: 1.7;
    }

    /* フッター */
    .footer {
      background: var(--navy);
      border-top: 1px solid rgba(255,255,255,0.07);
      padding: 32px 24px;
    }

    .footer__inner {
      max-width: var(--max-w);
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }

    .footer__logo {
      font-weight: 900;
      font-size: 16px;
      letter-spacing: 0.14em;
      color: var(--white);
    }

    .footer__links {
      display: flex;
      gap: 20px;
      list-style: none;
      flex-wrap: wrap;
    }

    .footer__links a {
      font-size: 12px;
      color: rgba(255,255,255,0.65);
      transition: color 0.2s;
    }

    .footer__links a:hover { color: rgba(255,255,255,0.85); }

    .footer__copy {
      width: 100%;
      padding-top: 20px;
      border-top: 1px solid rgba(255,255,255,0.06);
      font-size: 11px;
      color: rgba(255,255,255,0.5);
      text-align: center;
    }

    @media (max-width: 600px) {
      .thanks-card__body {
        padding: 40px 28px 36px;
      }

      .footer__inner {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>

  <nav class="nav">
    <div class="nav__inner">
      <div class="nav__logo">MOTE LAB<span>魅力は、行動で変えられる</span></div>
    </div>
  </nav>

  <main class="main">
    <div class="thanks-card">
      <div class="thanks-card__body">

        <div class="thanks-card__icon">
          <svg class="thanks-card__check" viewBox="0 0 24 24" aria-hidden="true">
            <polyline points="4 13 9 18 20 7"/>
          </svg>
        </div>

        <p class="thanks-card__pre">Received</p>
        <h1 class="thanks-card__heading">
          ありがとう。<br>
          ちゃんと届いた。
        </h1>
        <p class="thanks-card__body-text">
          送ってくれた内容を確認する。<br>
          2営業日以内に、連絡先に返信する。<br>
          もし急ぎなら、LINEで話そう。
        </p>

        <div class="thanks-card__actions">
          <a href="/" class="btn-navy">トップページへ戻る</a>
          <a href="https://test.mote-lab.group" class="btn-gold">無料でMOTEスコア診断を受ける</a>
          <a href="https://lin.ee/QVKHSTm" target="_blank" rel="noopener" class="btn-line">公式LINEで話す</a>
        </div>

        <div class="thanks-card__note">
          入力いただいた情報は、返信のご連絡にのみ使用します。<br>
          詳しくは<a href="privacy.html" style="color:var(--navy);text-decoration:underline;text-underline-offset:3px;">プライバシーポリシー</a>をご覧ください。
        </div>

      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="footer__inner">
      <div class="footer__logo">MOTE LAB</div>
      <ul class="footer__links">
        <li><a href="privacy.html">プライバシーポリシー</a></li>
        <li><a href="tokushoho.html">特定商取引法に基づく表記</a></li>
        <li><a href="https://lin.ee/QVKHSTm" target="_blank" rel="noopener">お問い合わせ（公式LINE）</a></li>
      </ul>
    </div>
    <div class="footer__inner">
      <p class="footer__copy">&copy; 2026 株式会社MoteLab（設立準備中）. All rights reserved.</p>
    </div>
  </footer>

</body>
</html>
